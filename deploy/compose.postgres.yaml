# Add after compose.public.yaml. PostgreSQL has no host port mapping.
services:
  web:
    environment:
      RETAILOPS_DATA_MODE: persistent-demo
      RETAILOPS_STORAGE_BACKEND: postgresql
      RETAILOPS_DATABASE_URL: ""
      RETAILOPS_DATABASE_URL_FILE: /run/secrets/retailops_database_url
    secrets:
      - retailops_database_url
    depends_on:
      postgres: {condition: service_healthy}
  postgres:
    image: postgres:16.15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_admin_password
      - postgres_app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/10-retailops.sh:ro
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    shm_size: 128m
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
secrets:
  postgres_admin_password:
    file: ./postgres-secrets/admin-password
  postgres_app_password:
    file: ./postgres-secrets/app-password
  retailops_database_url:
    file: ./postgres-secrets/database-url
volumes:
  postgres_data:
