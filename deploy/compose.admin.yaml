# Optional overlay: no host port, no database/model secret, read-only snapshots.
services:
  caddy:
    volumes:
      - ./admin-caddy:/etc/caddy/admin:ro
    networks:
      - default
      - admin_internal
  admin:
    image: ${RETAILOPS_IMAGE:?Complete the application deployment first}
    entrypoint: ["python", "-m", "opsconsole.server"]
    command: []
    init: true
    restart: unless-stopped
    environment:
      RETAILOPS_ADMIN_HOST: ${RETAILOPS_ADMIN_HOST:?Run admin-console.py install}
      RETAILOPS_CONSOLE_DATA: /console-data
    volumes:
      - ./console-data:/console-data:ro
    networks: [admin_internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 48
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz',timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
networks:
  admin_internal:
    internal: true
