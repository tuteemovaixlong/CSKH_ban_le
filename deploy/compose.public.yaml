services:
  web:
    image: ${RETAILOPS_IMAGE:?Complete CD before starting HTTPS}
    init: true
    restart: unless-stopped
    entrypoint: ["python", "retailops_public.py"]
    command: []
    env_file:
      - inference.env
      - api.env
      - public.env
    environment:
      RETAILOPS_OUTPUT: /data
    volumes:
      - ${RETAILOPS_DATA_DIR:-/opt/retailops/artifacts}:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 512m
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      web: {condition: service_healthy}
    environment:
      RETAILOPS_PUBLIC_HOST: ${RETAILOPS_PUBLIC_HOST:?Run the HTTPS setup script}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
volumes:
  caddy_data:
  caddy_config:
