name: Materialize reviewed RAG sources
on:
  push:
    branches: [feat/rag-chat-citations]
    paths: [.github/workflows/rag-workbench.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'tuteemovaixlong/CSKH_ban_le' && github.ref == 'refs/heads/feat/rag-chat-citations'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Apply exact locally tested patch and regenerate notebook
        run: |
          python3 - <<'PY'
          import base64, hashlib, subprocess, zlib
          from pathlib import Path
          data = ''.join(Path('.github/rag-workbench/changes.'+str(i)+'.b64').read_text().strip() for i in range(3))
          patch = zlib.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'b9964f3c3fa417acdf081dbe22e8e9ada28d17f55bfda2f79085041517421942'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          python3 -m compileall -q retailops tests agent_protocol.py retailops_tools.py
          python3 -m unittest discover -s tests -p test_rag_citations.py -v
          for file in web/*.js; do node --check "$file"; done
          for file in tests/test_*.js; do node "$file"; done
          RETAILOPS_UI_TEST_MODE=persistent node tests/test_public_session.js
          python3 scripts/build_agent_notebook.py
          python3 scripts/build_agent_notebook.py --check
      - name: Create verified detached commit only; never update a ref or deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY'] == 'tuteemovaixlong/CSKH_ban_le'
          assert os.environ['GITHUB_REF'] == 'refs/heads/feat/rag-chat-citations'
          allowed = {'.github/workflows/ci.yml', 'README.md', 'agent_protocol.py', 'docs/RAG_CHAT.md',
              'retailops/business/application.py', 'retailops/knowledge/citations.py',
              'retailops/knowledge/tool.py', 'retailops/workflow/agent.py', 'retailops_tools.py',
              'scripts/build_agent_notebook.py', 'tests/test_knowledge_sources.js',
              'tests/test_rag_chat.py', 'tests/test_rag_citations.py', 'web/app.js',
              'web/chat-focus.css', 'notebooks/colab_agent.ipynb'}
          removed = ['.github/workflows/rag-workbench.yml'] + [
              '.github/rag-workbench/changes.'+str(i)+'.b64' for i in range(3)]
          subprocess.run(['git', 'add', '--'] + sorted(allowed), check=True)
          subprocess.run(['git', 'rm', '--'] + removed, check=True)
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          assert changed == allowed | set(removed), changed
          expected_tree = '2e87bbde2a4edab92af3e0ec1f1d6537b0d06597'
          assert subprocess.check_output(['git','write-tree'], text=True).strip() == expected_tree, 'Result differs from locally reviewed source tree'
          assert subprocess.check_output(['git','hash-object','notebooks/colab_agent.ipynb'], text=True).strip() == '03096decc6b58dcfa570c21a1e1d910e0bd8bed4'
          def api(path, payload):
              req = urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/'+path,
                  data=json.dumps(payload).encode(), method='POST',
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response: return json.load(response)
          base = subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip()
          entries = [{'path':p,'mode':'100644','type':'blob','content':Path(p).read_text()} for p in sorted(allowed)]
          entries += [{'path':p,'mode':'100644','type':'blob','sha':None} for p in removed]
          tree = api('trees', {'base_tree':base, 'tree':entries})['sha']
          assert tree == expected_tree
          commit = api('commits', {'tree':tree,'parents':[os.environ['GITHUB_SHA']],
              'message':'Connect tenant-scoped RAG to chat with provenance-checked source citations'})['sha']
          print('VERIFIED_TREE='+tree)
          print('REGENERATED_COMMIT='+commit)
          PY
