name: Validate worker scope repair
on:
  push:
    branches: [fix/worker-tools-shipment-ui-20260920]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Apply exact reviewed source changes
        run: |
          python .repair2/apply.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('.repair2/expected.json').read_text())
          for name, expected in manifest.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == expected, (name, actual, expected)
          print('REVIEWED_SOURCE_MATCH', len(manifest))
          PY
      - name: Validate Python and browser regression tests
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-graph.txt
          python -m unittest discover -s tests -v
          for file in web/*.js; do node --check "$file"; done
          node tests/test_chat_focus.js
          node tests/test_model_status.js
          node tests/test_knowledge_sources.js
          node tests/test_provider_selector.js
          node tests/test_public_session.js
          RETAILOPS_UI_TEST_MODE=persistent node tests/test_public_session.js
          node tests/test_shipment_ui.js
          python scripts/check_deployment_contract.py
          python scripts/check_live_e2e_contract.py
          bash -n deploy/rollout-public-web.sh
      - name: Regenerate notebook and finalize repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/build_agent_notebook.py
          python scripts/build_agent_notebook.py --check
          rm -rf .repair2
          rm .github/workflows/repair-source.yml
          git add -- .repair2 .github/workflows/repair-source.yml .github/workflows/ci.yml agent_protocol.py inference_proxy.py retailops_agent.py retailops_providers.py retailops/business/application.py retailops/workflow/subagents/order_agent.py retailops/workflow/subagents/read_worker.py web/app.js tests/test_worker_scope_results.py tests/test_shipment_ui.js notebooks/colab_agent.ipynb
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: finalize scoped tools, complete order evidence rendering and truthful shipment UI'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/worker-tools-shipment-ui-20260920
          git rev-parse HEAD
