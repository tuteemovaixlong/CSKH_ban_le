name: Prepare PR14 notebook refresh
on:
  push:
    branches: [ui/chat-layout-focus]
    paths: [.github/workflows/refresh-pr14.yml, scripts/repair_pr14.py]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'tuteemovaixlong/CSKH_ban_le' && github.ref == 'refs/heads/ui/chat-layout-focus'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Apply reviewed source edits and regenerate standalone notebook
        run: |
          python3 scripts/repair_pr14.py
          python3 scripts/build_agent_notebook.py
          python3 scripts/build_agent_notebook.py --check
          for file in web/*.js; do node --check "$file"; done
          node tests/test_chat_focus.js
          node tests/test_model_status.js
          node tests/test_provider_selector.js
          node tests/test_public_session.js
          RETAILOPS_UI_TEST_MODE=persistent node tests/test_public_session.js
          python3 -m pip install --only-binary=:all: --require-hashes -r requirements-graph.txt
          python3 -m unittest discover -s tests -v
      - name: Export source blobs only (no trees, commits, refs, settings or deployment)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, urllib.request, urllib.error
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'tuteemovaixlong/CSKH_ban_le'
          assert os.environ['GITHUB_REF'] == 'refs/heads/ui/chat-layout-focus'
          allowed = {'web/index.html', 'web/app.js', 'retailops/http/public.py',
              'retailops/http/private.py', '.github/workflows/ci.yml',
              'scripts/check_public_https.py', 'notebooks/colab_agent.ipynb'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == allowed, changed
          result = {}
          for path in sorted(changed):
              # Workflow edits are committed separately through the authorized connector.
              if path.startswith('.github/'):
                  continue
              content = Path(path).read_text(encoding='utf-8')
              raw = content.encode('utf-8')
              expected = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/git/blobs',
                  data=json.dumps({'content': content, 'encoding': 'utf-8'}).encode(), method='POST',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'User-Agent': 'retailops-source-refresh', 'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      actual = json.load(response)['sha']
              except urllib.error.HTTPError as error:
                  info = json.loads(error.read().decode())
                  raise SystemExit('Blob export failed: HTTP ' + str(error.code) + ' ' + info.get('message', '')) from None
              assert actual == expected, path
              result[path] = actual
          print('REGENERATED_BLOBS=' + json.dumps(result, sort_keys=True))
          PY
