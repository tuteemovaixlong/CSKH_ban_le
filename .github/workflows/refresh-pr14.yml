name: Prepare PR14 notebook refresh
on:
  push:
    branches: [ui/chat-layout-focus]
    paths: [.github/workflows/refresh-pr14.yml, scripts/repair_pr14.py]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'tuteemovaixlong/CSKH_ban_le' && github.ref == 'refs/heads/ui/chat-layout-focus'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Apply reviewed source edits and regenerate standalone notebook
        run: |
          python3 scripts/repair_pr14.py
          python3 scripts/build_agent_notebook.py
          python3 scripts/build_agent_notebook.py --check
          for file in web/*.js; do node --check "$file"; done
          node tests/test_chat_focus.js
          node tests/test_model_status.js
          node tests/test_provider_selector.js
          node tests/test_public_session.js
          RETAILOPS_UI_TEST_MODE=persistent node tests/test_public_session.js
          python3 -m pip install --only-binary=:all: --require-hashes -r requirements-graph.txt
          python3 -m unittest discover -s tests -v
      - name: Create reviewed Git objects only (never update any branch or deploy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          parent = os.environ['GITHUB_SHA']
          assert repo == 'tuteemovaixlong/CSKH_ban_le'
          assert os.environ['GITHUB_REF'] == 'refs/heads/ui/chat-layout-focus'
          allowed = {'web/index.html', 'web/app.js', 'retailops/http/public.py',
              'retailops/http/private.py', '.github/workflows/ci.yml',
              'scripts/check_public_https.py', 'notebooks/colab_agent.ipynb'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == allowed, changed
          def api(path, payload):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/git/' + path,
                  data=json.dumps(payload).encode(), method='POST',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          entries = [{'path': p, 'mode': '100644', 'type': 'blob', 'content': Path(p).read_text()} for p in sorted(changed)]
          # One-time build helper and its write permission do not remain in the final tree.
          entries += [{'path': p, 'mode': '100644', 'type': 'blob', 'sha': None} for p in
              ('.github/workflows/refresh-pr14.yml', 'scripts/repair_pr14.py')]
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          tree = api('trees', {'base_tree': base, 'tree': entries})['sha']
          commit = api('commits', {'message': 'Fix UI asset serving and status selectors; refresh verified Colab bundle',
              'tree': tree, 'parents': [parent]})['sha']
          print('REVIEWED_TREE=' + tree)
          print('REGENERATED_COMMIT=' + commit)
          PY
