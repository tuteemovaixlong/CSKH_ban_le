name: Prepare fullscreen UI notebook refresh
on:
  push:
    branches: [ui/fullscreen-chat-workspace]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'tuteemovaixlong/CSKH_ban_le' && github.ref == 'refs/heads/ui/fullscreen-chat-workspace'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Regenerate notebook and verify UI controller
        run: |
          python3 scripts/build_agent_notebook.py
          python3 scripts/build_agent_notebook.py --check
          for file in web/*.js; do node --check "$file"; done
          node tests/test_chat_focus.js
          node tests/test_model_status.js
          node tests/test_provider_selector.js
          node tests/test_public_session.js
          RETAILOPS_UI_TEST_MODE=persistent node tests/test_public_session.js
      - name: Export regenerated notebook blob only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          content = Path('notebooks/colab_agent.ipynb').read_text(encoding='utf-8')
          req = urllib.request.Request(
              'https://api.github.com/repos/' + repo + '/git/blobs',
              data=json.dumps({'content': content, 'encoding': 'utf-8'}).encode(),
              method='POST',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=60) as response:
              print('NOTEBOOK_BLOB=' + json.load(response)['sha'])
          PY
