name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: retailops_test
          POSTGRES_USER: retailops_test
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U retailops_test -d retailops_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      RETAILOPS_TEST_DATABASE_URL: postgresql://retailops_test:ci-only-disposable-password@127.0.0.1:5432/retailops_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify embedded agent notebook and JavaScript
        run: |
          python3 scripts/build_agent_notebook.py --check
          node --check web/app.js
          node tests/test_provider_selector.js
          node tests/test_public_session.js
          RETAILOPS_UI_TEST_MODE=persistent node tests/test_public_session.js
      - name: Unit and HTTP contract tests (no model, no secrets)
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r requirements-web.txt -r requirements-postgres.txt -r requirements-graph.txt -r requirements-embeddings.txt
          python3 -m unittest discover -s tests -v
      - name: Validate HTTPS configuration without issuing a certificate
        run: |
          bash -n deploy/start-public-web.sh
          bash -n deploy/init-postgres.sh
          docker run --rm --network none -e RETAILOPS_PUBLIC_HOST=retailops.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build CPU-only baseline image
        run: docker build -t retailops:ci .
      - name: Verify packaged application
        run: docker run --rm --network host -e RETAILOPS_TEST_DATABASE_URL --entrypoint python retailops:ci -m unittest discover -s tests -v
      - name: Verify HTTPS proxy and cookie session with a temporary test CA
        run: |
          python3 scripts/check_public_https.py
          python3 scripts/check_guest_cutover.py
      - name: Prepare real CPU embeddings and verify offline loading
        run: |
          mkdir -p "$RUNNER_TEMP/retailops-embedding"
          chmod 777 "$RUNNER_TEMP/retailops-embedding"
          docker run --rm --memory 1g -v "$RUNNER_TEMP/retailops-embedding:/data" --entrypoint python retailops:ci -m retailops knowledge prepare-model --directory /data/embedding-model
          docker run --rm --network none --memory 1g -e HF_HUB_OFFLINE=1 -v "$RUNNER_TEMP/retailops-embedding:/data:ro" -v "$PWD/scripts/check_embedding.py:/app/check_embedding.py:ro" --entrypoint python retailops:ci check_embedding.py
