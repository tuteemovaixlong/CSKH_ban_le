name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  colab-python313:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify Colab Python 3.13 binary dependency compatibility
        run: |
          python scripts/build_agent_notebook.py --check
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path('requirements-graph.txt')
          target = Path('/tmp/retailops-graph-py313.txt')
          lines = []
          for line in source.read_text(encoding='utf-8').splitlines():
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              line = re.sub(r'\s+--hash=sha256:[0-9a-f]{64}', '', line).strip()
              assert re.fullmatch(r'[A-Za-z0-9_.-]+==[^\s]+', line), line
              lines.append(line)
          target.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('COLAB_PY313_REQUIREMENTS_READY', len(lines))
          PY
          python -m pip install --disable-pip-version-check --only-binary=:all: -r /tmp/retailops-graph-py313.txt
          python - <<'PY'
          import langgraph, pydantic, httpx
          import agent_protocol
          assert agent_protocol.PROTOCOL == 'retailops-agent-v2'
          assert any(x['function']['name'] == 'search_knowledge' for x in agent_protocol.TOOLS)
          print('COLAB_PY313_DEPENDENCIES_OK')
          PY
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: retailops_test
          POSTGRES_USER: retailops_test
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U retailops_test -d retailops_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      RETAILOPS_TEST_DATABASE_URL: postgresql://retailops_test:ci-only-disposable-password@127.0.0.1:5432/retailops_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate documentation contracts
        run: python3 scripts/check_docs_contract.py
      - name: Validate evaluation dataset contract
        run: python3 scripts/check_eval_dataset.py
      - name: Validate live E2E harness contract
        run: |
          python3 -m py_compile deploy/live-e2e.py deploy/trigger_live_e2e.py
          python3 scripts/check_live_e2e_contract.py
      - name: Verify embedded agent notebook and JavaScript
        run: |
          python3 scripts/build_agent_notebook.py --check
          for file in web/*.js; do node --check "$file"; done
          node tests/test_chat_focus.js
          node tests/test_model_status.js
          node tests/test_knowledge_sources.js
          node tests/test_shipment_ui.js
          node tests/test_provider_selector.js
          node tests/test_public_session.js
          RETAILOPS_UI_TEST_MODE=persistent node tests/test_public_session.js
      - name: Unit, pgvector and HTTP contract tests (no model, no secrets)
        env:
          RETAILOPS_HEADROOM_ARTIFACT_PATH: ${{ runner.temp }}/headroom_p99_artifact.json
        run: |
          rm -f "${{ runner.temp }}/headroom_p99_artifact.json"
          python3 -m pip install --only-binary=:all: --require-hashes -r requirements-web.txt -r requirements-postgres.txt -r requirements-graph.txt
          python3 scripts/prepare_test_pgvector.py
          python3 -m unittest discover -s tests -v
      - name: Validate headroom P99 measurement artifact integrity
        env:
          HEADROOM_ARTIFACT_PATH: ${{ runner.temp }}/headroom_p99_artifact.json
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, math, os, sys
          from pathlib import Path

          artifact_path = Path(os.environ.get("HEADROOM_ARTIFACT_PATH", ""))
          if not artifact_path.is_file():
              print(f"FAIL: Headroom artifact not found at {artifact_path}", file=sys.stderr)
              sys.exit(1)

          try:
              data = json.loads(artifact_path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"FAIL: Artifact is not valid JSON: {exc}", file=sys.stderr)
              sys.exit(1)

          expected_sha = os.environ.get("EXPECTED_SHA", "").strip()
          actual_sha = str(data.get("commit_sha", "")).strip()
          if expected_sha and actual_sha != expected_sha:
              print(f"FAIL: commit_sha mismatch! expected={expected_sha}, actual={actual_sha}", file=sys.stderr)
              sys.exit(1)

          assert data.get("protocol") == "AC09-P99-EVIDENCE", f"Unexpected protocol: {data.get('protocol')}"
          assert data.get("configuration", {}).get("total_batches") == 10, "Configuration total_batches != 10"
          assert data.get("configuration", {}).get("total_samples_per_endpoint") == 1000, "total_samples_per_endpoint != 1000"

          batches = data.get("batches")
          if not isinstance(batches, list) or len(batches) != 10:
              print(f"FAIL: batches must be list of 10 items, got {len(batches) if isinstance(batches, list) else type(batches)}", file=sys.stderr)
              sys.exit(1)

          for idx, b in enumerate(batches):
              assert b.get("batch_index") == idx, f"Batch {idx} wrong index {b.get('batch_index')}"
              assert b.get("healthz_samples") == 100, f"Batch {idx} healthz_samples != 100"
              assert b.get("session_samples") == 100, f"Batch {idx} session_samples != 100"
              assert b.get("saturation_confirmed") is True, f"Batch {idx} saturation_confirmed is not True"
              assert b.get("bound_calls_count", 0) >= 1, f"Batch {idx} bound_calls_count < 1"
              statuses = b.get("worker_statuses", [])
              assert len(statuses) == 6 and all(s == 200 for s in statuses), f"Batch {idx} worker statuses != [200]*6 ({statuses})"

          raw = data.get("raw_samples", {})
          health_samples = raw.get("healthz_ms", [])
          session_samples = raw.get("api_session_ms", [])
          assert len(health_samples) == 1000, f"raw healthz_ms count != 1000 ({len(health_samples)})"
          assert len(session_samples) == 1000, f"raw api_session_ms count != 1000 ({len(session_samples)})"

          summary = data.get("summary", {})
          assert summary.get("saturation_verified") is True, "summary saturation_verified is not True"
          assert summary.get("tool_hook_executed") is True, "summary tool_hook_executed is not True"

          h_sum = summary.get("healthz", {})
          s_sum = summary.get("api_session", {})
          assert h_sum.get("n") == 1000, f"healthz n != 1000 ({h_sum.get('n')})"
          assert s_sum.get("n") == 1000, f"api_session n != 1000 ({s_sum.get('n')})"
          assert h_sum.get("slo_50ms_met") is True, f"healthz slo_50ms_met is not True ({h_sum})"
          assert s_sum.get("slo_50ms_met") is True, f"api_session slo_50ms_met is not True ({s_sum})"

          s_health = sorted(health_samples)
          s_session = sorted(session_samples)
          p99_idx = math.ceil(0.99 * 1000) - 1
          p99_h_raw = s_health[p99_idx]
          p99_s_raw = s_session[p99_idx]
          assert p99_h_raw <= 50.0, f"Computed raw healthz P99 {p99_h_raw}ms exceeds 50.0ms SLO"
          assert p99_s_raw <= 50.0, f"Computed raw api_session P99 {p99_s_raw}ms exceeds 50.0ms SLO"

          print(f"HEADROOM_ARTIFACT_INTEGRITY_OK: {actual_sha} (healthz P99={p99_h_raw:.3f}ms, session P99={p99_s_raw:.3f}ms)")
          PY
      - name: Save headroom P99 measurement artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: headroom-p99-artifact-${{ github.sha }}
          path: ${{ runner.temp }}/headroom_p99_artifact.json
          retention-days: 14
          if-no-files-found: error
      - name: Validate HTTPS, PostgreSQL and rollout deployment scripts
        run: |
          python3 scripts/check_deployment_contract.py
          bash -n deploy/start-public-web.sh
          bash -n deploy/init-postgres.sh
          bash -n deploy/cutover-postgres.sh
          bash -n deploy/enable-pgvector.sh
          bash -n deploy/rollout-public-web.sh
          bash -n deploy/switch-maintenance.sh
          docker run --rm --network none -e RETAILOPS_PUBLIC_HOST=retailops.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm --network none -e RETAILOPS_PUBLIC_HOST=retailops.example.com -v "$PWD/deploy/Caddyfile.maintenance:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build CPU-only baseline image
        run: docker build -t retailops:ci .
      - name: Verify packaged application and deployment helpers
        run: |
          docker run --rm --network none --entrypoint sh retailops:ci -c 'test -f /app/deploy/rollout-public-web.sh && test -f /app/deploy/cutover-postgres.sh && test -f /app/deploy/enable-pgvector.sh && test -f /app/deploy/live-e2e.py && test -f /app/data/knowledge/cancellation.md && test -f /app/notebooks/colab_agent.ipynb'
          docker run --rm --network none --entrypoint python retailops:ci -c "compile(open('/app/deploy/live-e2e.py', encoding='utf-8').read(), '/app/deploy/live-e2e.py', 'exec'); print('LIVE_E2E_PACKAGED_SOURCE_OK')"
          docker run --rm --network host -e RETAILOPS_TEST_DATABASE_URL --entrypoint python retailops:ci -m unittest discover -s tests -v
      - name: Verify HTTPS proxy and cookie session with a temporary test CA
        run: python3 scripts/check_public_https.py
