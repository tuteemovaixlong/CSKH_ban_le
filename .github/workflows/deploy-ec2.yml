name: Deploy baseline runner to EC2
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy-retailops-demo
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.RETAILOPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify source and image without inference
        run: |
          python3 scripts/check_deployment_contract.py
          bash -n deploy/cutover-postgres.sh
          bash -n deploy/rollout-public-web.sh
          python3 -m pip install --only-binary=:all: --require-hashes -r requirements-graph.txt
          python3 -m unittest discover -s tests -v
          docker build -t retailops:deploy .
          docker run --rm --network none --entrypoint sh retailops:deploy -c 'test -f /app/deploy/rollout-public-web.sh && test -f /app/deploy/cutover-postgres.sh'
          docker run --rm --entrypoint python retailops:deploy -m unittest discover -s tests -v
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4, resolved 2026-09-06
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: retailops-${{ github.run_id }}
      - name: Publish image, activate runner and roll configured public web
        run: python3 deploy/publish_and_activate.py
