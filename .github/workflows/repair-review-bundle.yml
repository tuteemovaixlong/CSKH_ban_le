name: Repair review bundle
on:
  push:
    branches: [fix/order-tool-errors-20260920]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Archive tracked source and exact dependency versions
        run: |
          mkdir -p /tmp/repair-review
          git archive --format=zip --output=/tmp/repair-review/source.zip HEAD
          git rev-parse HEAD > /tmp/repair-review/source-sha.txt
          python - <<'PY'
          import re
          from pathlib import Path
          lines = []
          for line in Path('requirements-graph.txt').read_text().splitlines():
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              line = re.sub(r'\s+--hash=sha256:[0-9a-f]{64}', '', line).strip()
              assert re.fullmatch(r'[A-Za-z0-9_.-]+==[^\s]+', line), line
              lines.append(line)
          Path('/tmp/repair-review/requirements.txt').write_text('\n'.join(lines) + '\n')
          PY
          python -m pip download --only-binary=:all: -r /tmp/repair-review/requirements.txt -d /tmp/repair-review/wheels
          sha256sum /tmp/repair-review/wheels/* > /tmp/repair-review/wheel-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repair-review-py313
          path: /tmp/repair-review
          retention-days: 1
