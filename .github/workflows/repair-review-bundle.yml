name: Repair review bundle
on:
  push:
    branches: [fix/order-tool-errors-20260920]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Archive tracked source only
        run: |
          mkdir -p /tmp/repair-review
          git archive --format=zip --output=/tmp/repair-review/source.zip HEAD
          git rev-parse HEAD > /tmp/repair-review/source-sha.txt
      - name: Download pinned dependencies for isolated tests
        run: |
          python -m pip download --only-binary=:all: --require-hashes -r requirements-graph.txt -d /tmp/repair-review/wheels
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repair-review-bundle
          path: /tmp/repair-review
          retention-days: 1
