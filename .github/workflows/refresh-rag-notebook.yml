name: Refresh RAG notebook
on:
  push:
    branches: [feat/rag-pgvector-foundation]
    paths: [.github/workflows/refresh-rag-notebook.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/rag-pgvector-foundation
      - name: Regenerate and verify standalone notebook
        run: |
          python3 scripts/build_agent_notebook.py
          python3 scripts/build_agent_notebook.py --check
          git diff --check
      - name: Commit generated notebook when changed
        run: |
          if ! git diff --quiet -- notebooks/colab_agent.ipynb; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add notebooks/colab_agent.ipynb
            git commit -m 'Refresh standalone notebook for RAG foundation'
            git push origin HEAD:feat/rag-pgvector-foundation
          else
            echo NOTEBOOK_ALREADY_CURRENT
          fi
