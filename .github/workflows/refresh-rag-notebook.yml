name: Refresh RAG notebook once
on:
  push:
    branches: [feat/rag-pgvector-foundation]
    paths: [.github/workflows/refresh-rag-notebook.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/rag-pgvector-foundation
      - name: Regenerate, verify, and remove this one-time workflow
        run: |
          python3 scripts/build_agent_notebook.py
          python3 scripts/build_agent_notebook.py --check
          git diff --check
          git rm .github/workflows/refresh-rag-notebook.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/colab_agent.ipynb
          git commit -m 'Refresh notebook after pgvector restore fix'
          git push origin HEAD:feat/rag-pgvector-foundation
