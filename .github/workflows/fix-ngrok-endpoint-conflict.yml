name: Repair Colab ngrok endpoint conflict
on:
  push:
    branches: [fix/colab-v2-clean-startup]
    paths: [.github/workflows/fix-ngrok-endpoint-conflict.yml]
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Patch generator and regenerate notebook
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/build_agent_notebook.py')
          text = path.read_text(encoding='utf-8')
          old = '''    try:\n        ngrok.set_auth_token(_ngrok_token)\n        _agent_tunnel = ngrok.connect(\n            addr='http://127.0.0.1:8002', proto='http',\n            bind_tls=True, inspect=False,\n        )\n        _public = urlsplit(_agent_tunnel.public_url)\n        if _public.scheme != 'https' or not _public.hostname:\n            raise RuntimeError('HTTPS tunnel required')\n    except Exception:\n        if globals().get('_agent_tunnel') is not None:\n            try:\n                ngrok.disconnect(_agent_tunnel.public_url)\n            except Exception:\n                pass\n            _agent_tunnel = None\n        _agent_proxy.shutdown(); _agent_proxy.server_close(); _agent_proxy = None\n        raise\n    finally:\n        del _ngrok_token, _inference_token\n'''
          new = '''    try:\n        ngrok.set_auth_token(_ngrok_token)\n\n        # A previous Cell 3 in this runtime can leave an ngrok agent process alive\n        # even after its tunnel object was disconnected. Kill only the local agent\n        # before claiming the account's static dev endpoint again.\n        try:\n            ngrok.kill()\n        except Exception as _exc:\n            print('Local ngrok cleanup warning:', type(_exc).__name__)\n        time.sleep(1.0)\n\n        _agent_tunnel = None\n        _tunnel_error = None\n        for _attempt in range(1, 7):\n            try:\n                _agent_tunnel = ngrok.connect(\n                    addr='http://127.0.0.1:8002', proto='http',\n                    bind_tls=True, inspect=False,\n                )\n                break\n            except Exception as _exc:\n                _tunnel_error = _exc\n                _message = str(_exc)\n                if 'ERR_NGROK_334' not in _message and 'already online' not in _message:\n                    raise\n                print(\n                    f'ngrok endpoint is still online; retry {_attempt}/6 ' \\n                    '(pooling stays disabled)…',\n                    flush=True,\n                )\n                try:\n                    ngrok.kill()\n                except Exception:\n                    pass\n                time.sleep(min(2 * _attempt, 10))\n\n        if _agent_tunnel is None:\n            raise RuntimeError(\n                'Ngrok static endpoint vẫn đang online ở runtime/process khác. ' \\n                'Hãy dừng CELL STOP ở notebook cũ hoặc tắt endpoint/runtime cũ rồi ' \\n                'chạy lại CELL 3. Không bật pooling: pooling có thể trộn proxy v1/v2. ' \\n                'Last error: ' + str(_tunnel_error)\n            )\n\n        _public = urlsplit(_agent_tunnel.public_url)\n        if _public.scheme != 'https' or not _public.hostname:\n            raise RuntimeError('HTTPS tunnel required')\n    except Exception:\n        if globals().get('_agent_tunnel') is not None:\n            try:\n                ngrok.disconnect(_agent_tunnel.public_url)\n            except Exception:\n                pass\n            _agent_tunnel = None\n        try:\n            ngrok.kill()\n        except Exception:\n            pass\n        _agent_proxy.shutdown(); _agent_proxy.server_close(); _agent_proxy = None\n        raise\n    finally:\n        del _ngrok_token, _inference_token\n'''
          if text.count(old) != 1:
              raise SystemExit('Expected tunnel block not found exactly once')
          text = text.replace(old, new)
          old_stop = '''        try:\n            from pyngrok import ngrok\n            ngrok.disconnect(_agent_tunnel.public_url)\n        except Exception as _exc:\n            print('Tunnel stop warning:', type(_exc).__name__)\n        _agent_tunnel = None\n'''
          new_stop = '''        try:\n            from pyngrok import ngrok\n            ngrok.disconnect(_agent_tunnel.public_url)\n            ngrok.kill()\n        except Exception as _exc:\n            print('Tunnel stop warning:', type(_exc).__name__)\n        _agent_tunnel = None\n'''
          if text.count(old_stop) != 1:
              raise SystemExit('Expected STOP block not found exactly once')
          path.write_text(text.replace(old_stop, new_stop), encoding='utf-8')
          PY
          python3 -m py_compile scripts/build_agent_notebook.py
          python3 scripts/build_agent_notebook.py
          python3 scripts/build_agent_notebook.py --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('notebooks/colab_agent.ipynb').read_text(encoding='utf-8')
          for marker in ('ERR_NGROK_334', 'pooling stays disabled', 'ngrok.kill()', 'CELL_3_READY'):
              assert marker in text, marker
          print('NGROK_CONFLICT_NOTEBOOK_OK')
          PY
      - name: Commit repaired generator and notebook
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          parent = os.environ['GITHUB_SHA']
          branch = 'fix/colab-v2-clean-startup'
          token = os.environ['GH_TOKEN']
          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request('https://api.github.com/repos/' + repo + path, data=data, method=method,
                  headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          parent_obj = api('GET', '/git/commits/' + parent)
          base_tree = parent_obj['tree']['sha']
          entries = []
          for p in ('scripts/build_agent_notebook.py', 'notebooks/colab_agent.ipynb'):
              blob = api('POST', '/git/blobs', {'content': Path(p).read_text(encoding='utf-8'), 'encoding': 'utf-8'})['sha']
              entries.append({'path': p, 'mode': '100644', 'type': 'blob', 'sha': blob})
          entries.append({'path': '.github/workflows/fix-ngrok-endpoint-conflict.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('POST', '/git/trees', {'base_tree': base_tree, 'tree': entries})['sha']
          commit = api('POST', '/git/commits', {'message': 'Handle stale ngrok endpoint conflicts in Colab',
                                                'tree': tree, 'parents': [parent]})['sha']
          api('PATCH', '/git/refs/heads/' + branch, {'sha': commit, 'force': False})
          print('REPAIR_COMMIT=' + commit)
          PY